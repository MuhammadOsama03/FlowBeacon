name: Application CI

on:
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - "services/web/**"
      - "scripts/**"
      - "Dockerfile"
      - "compose.yaml"
      - ".github/workflows/api-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/api/**"
      - "services/web/**"
      - "scripts/**"
      - "Dockerfile"
      - "compose.yaml"
      - ".github/workflows/api-ci.yml"

permissions:
  contents: read

concurrency:
  group: flowbeacon-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/api

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --requirement requirements.txt
          python -m pip check

      - name: Compile source
        run: python -m compileall -q app tests ../../examples ../../scripts

      - name: Validate dashboard modules
        working-directory: services/web
        run: |
          node --check app.js
          node --check api.js

      - name: Run tests
        run: python -m pytest --quiet

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build --tag flowbeacon:ci .

      - name: Start hardened container
        run: |
          docker run --detach --name flowbeacon --read-only --tmpfs /tmp \
            --mount type=volume,destination=/data -p 8000:8000 \
            -e FLOWBEACON_ENVIRONMENT=production \
            -e FLOWBEACON_DATABASE_PATH=/data/flowbeacon.db \
            -e FLOWBEACON_INGESTION_API_KEY=ci-smoke-key-with-24-characters \
            -e FLOWBEACON_ADMIN_API_KEY=ci-admin-key-with-24-characters \
            flowbeacon:ci
          for attempt in {1..20}; do
            curl --fail --silent http://localhost:8000/ready && break
            sleep 1
          done

      - name: Exercise deployment
        env:
          FLOWBEACON_API_KEY: ci-smoke-key-with-24-characters
        run: python scripts/smoke_test.py

      - name: Show container logs on failure
        if: failure()
        run: docker logs flowbeacon
