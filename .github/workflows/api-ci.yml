name: Application CI

on:
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - "services/web/**"
      - ".github/workflows/api-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/api/**"
      - "services/web/**"
      - ".github/workflows/api-ci.yml"

permissions:
  contents: read

concurrency:
  group: flowbeacon-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/api

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Compile source
        run: python -m compileall -q app tests

      - name: Validate dashboard modules
        working-directory: services/web
        run: |
          node --check app.js
          node --check api.js

      - name: Run tests
        run: python -m pytest --quiet
